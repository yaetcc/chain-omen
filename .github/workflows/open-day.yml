name: open-day

on:
  schedule:
    - cron: "7 * * * *" # hourly at :07; opens the day right after 00:00 UTC+8
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open-day
  cancel-in-progress: false

jobs:
  open:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Open today's fortune
        env:
          PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          CONTRACT: ${{ vars.FORTUNESEAL_ADDRESS || '0x5d07f0386d53f99bacd6baaf85c289201313565a' }}
          RPC_URL: ${{ vars.XLAYER_RPC_URL || 'https://rpc.xlayer.tech' }}
        run: bash scripts/keeper.sh
